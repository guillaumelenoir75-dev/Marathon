name: Localisation gare de Val-de-Reuil (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Géocodage
        continue-on-error: true
        run: |
          mkdir -p fetch/gare && cd fetch/gare
          UA="marathon-prepa/1.0 (github actions)"
          curl -sS -m 60 -A "$UA" "https://nominatim.openstreetmap.org/search?q=Gare+de+Val-de-Reuil&format=jsonv2&limit=5" -o nomi1.json || true
          sleep 2
          curl -sS -m 60 -A "$UA" "https://nominatim.openstreetmap.org/search?q=Val-de-Reuil+railway+station&format=jsonv2&limit=5" -o nomi2.json || true
          curl -sS -m 60 "https://api-adresse.data.gouv.fr/search/?q=gare+Val-de-Reuil&limit=5" -o ban.json || true
          Q='[out:json][timeout:60];(nwr["railway"~"station|halt"](49.22,1.15,49.30,1.26);nwr["amenity"="parking"](49.255,1.19,49.275,1.22);nwr["public_transport"="station"](49.22,1.15,49.30,1.26););out center tags;'
          for k in 1 2 3; do for srv in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -sS -m 120 -A "$UA" --data-urlencode "data=$Q" "$srv" -o over.json || true
            python3 -c "import json;json.load(open('over.json'))" && break 2; sleep 10; done; done
          ls -la
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: gare Val-de-Reuil (temporaire)" || true
          git push
