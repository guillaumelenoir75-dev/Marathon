name: Récupération arrêté Saint-Étienne-du-Vauvray (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PDF
        run: |
          mkdir -p fetch/sev
          curl -sSL -A "Mozilla/5.0" "https://panneau-pocket.s3.gra.perf.cloud.ovh.net/source/sign_pdf/9738896346ace520c777128.14162085-1791906316.pdf" -o fetch/sev/arrete.pdf
          ls -la fetch/sev
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: arrêté Saint-Étienne-du-Vauvray (temporaire)" || true
          git push
