name: Audit production suivi (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture
        continue-on-error: true
        run: |
          mkdir -p audit/out
          DB=https://prepa-marathon-default-rtdb.europe-west1.firebasedatabase.app
          F=https://us-central1-prepa-marathon.cloudfunctions.net
          W=https://prepa-marathon.web.app
          {
          echo "== Fonctions"
          echo -n "owntracks clé invalide (403 attendu) : "; curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Content-Type: application/json" -d '{"_type":"location","lat":49,"lon":1}' $F/owntracks/test-invalide
          echo -n "owntracks GET (405 attendu) : "; curl -s -o /dev/null -w "%{http_code}\n" $F/owntracks/x
          echo -n "owntracksToken sans connexion (403 attendu) : "; curl -s -o /dev/null -w "%{http_code}\n" $F/owntracksToken
          echo "== Base de données"
          echo -n "clé OwnTracks privée (Permission denied attendu) : "; curl -s $DB/live_config.json; echo
          echo -n "écriture /live sans connexion (Permission denied attendu) : "; curl -s -X PATCH -d '{"zz":1}' $DB/live.json; echo
          echo -n "lecture /live publique : "; curl -s "$DB/live.json?shallow=true"; echo
          echo -n "/live (hors trace) : "; for k in status test startedAt finishedAt s0 s0t noAuto splits pos ota; do echo -n "$k="; curl -s $DB/live/$k.json; echo -n " ; "; done; echo
          echo "== Hébergement"
          for p in suivi-guillaume parcours suivi-admin; do echo -n "/$p : "; curl -s -o /tmp/p.html -w "%{http_code} " $W/$p; grep -o 'src="/src/[a-z-]*\.js?v=[0-9]*"' /tmp/p.html | tr '\n' ' '; echo; done
          echo -n "app index race-live : "; curl -s $W/ | grep -o 'race-live[^"]*' | head -2 | tr '\n' ' '; echo
          echo -n "suivi-core en ligne contient s0t / _suiviMax / SUIVI_PLAN : "; curl -s "$W/src/suivi-core.js?v=7" | grep -c -E "s0t|_suiviMax|SUIVI_PLAN"
          echo -n "suivi-view en ligne contient glide / Arrivée : "; curl -s "$W/src/suivi-view.js?v=9" | grep -c -E "function glide|'Arrivée'"
          echo -n "en-tête cache /src/suivi-core.js : "; curl -sI "$W/src/suivi-core.js" | grep -i cache-control
          echo -n "en-tête cache /suivi-guillaume : "; curl -sI "$W/suivi-guillaume" | grep -i cache-control
          date -u
          } > audit/out/prod.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: audit production (temporaire)" || true
          git push
