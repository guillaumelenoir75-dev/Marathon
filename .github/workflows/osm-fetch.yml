name: Récupération arrêté Porte-de-Seine (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Article + pièces jointes
        run: |
          mkdir -p fetch/pds && cd fetch/pds
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" "https://portedeseine.wordpress.com/2026/10/02/marathon-seine-eure-2026/" -o article.html || true
          curl -sSL -A "$UA" "https://public-api.wordpress.com/rest/v1.1/sites/portedeseine.wordpress.com/posts/slug:marathon-seine-eure-2026" -o api.json || true
          python3 - <<'PY'
          import re, json, html, urllib.request, os
          src = open('article.html', encoding='utf-8', errors='ignore').read()
          try:
              api = json.load(open('api.json')); src += api.get('content', '')
          except Exception as e: print('api', e)
          urls = set(re.findall(r'(?:href|src|data-orig-file|data-large-file)="(https?://[^"]+)"', src))
          keep = [u for u in urls if re.search(r'\.(pdf|jpe?g|png|webp)(\?|$)', u, re.I) and ('wp.com' in u or 'wordpress' in u or 'files' in u)]
          print('\n'.join(sorted(keep)))
          seen = set()
          for u in sorted(keep):
              base = html.unescape(u).split('?')[0]
              if base in seen: continue
              seen.add(base)
              full = base + ('' if base.lower().endswith('.pdf') else '?w=2400')
              name = re.sub(r'[^A-Za-z0-9._-]', '_', base.split('/')[-1])[:120]
              try:
                  req = urllib.request.Request(full, headers={'User-Agent': 'Mozilla/5.0'})
                  open(name, 'wb').write(urllib.request.urlopen(req, timeout=60).read()); print('ok', name)
              except Exception as e: print('ko', full, e)
          txt = re.sub(r'<script.*?</script>|<style.*?</style>', '', src, flags=re.S)
          txt = html.unescape(re.sub(r'<[^>]+>', '\n', txt)); txt = re.sub(r'\n\s*\n+', '\n', txt)
          open('texte.txt', 'w').write(txt)
          PY
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: article Porte-de-Seine (temporaire)" || true
          git push
