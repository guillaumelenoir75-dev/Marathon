name: Géocodage 481 chaussée des Berges (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adresses
        continue-on-error: true
        run: |
          mkdir -p fetch/berges && cd fetch/berges
          curl -sS -m 60 "https://api-adresse.data.gouv.fr/search/?q=481+chaussee+des+Berges+Val-de-Reuil&limit=5" -o ban481.json || true
          curl -sS -m 60 "https://api-adresse.data.gouv.fr/search/?q=chaussee+des+Berges+27100+Val-de-Reuil&type=street&limit=5" -o banrue.json || true
          for n in 1 101 201 301 401 451 481 501 601 701 801; do curl -sS -m 30 "https://api-adresse.data.gouv.fr/search/?q=$n+chaussee+des+Berges+27100+Val-de-Reuil&limit=1" -o ban_$n.json || true; done
          curl -sS -m 60 -A "marathon-prepa/1.0" "https://nominatim.openstreetmap.org/search?q=481+chauss%C3%A9e+des+Berges+Val-de-Reuil&format=jsonv2&limit=3" -o nomi.json || true
          ls -la
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: 481 chaussée des Berges (temporaire)" || true
          git push
