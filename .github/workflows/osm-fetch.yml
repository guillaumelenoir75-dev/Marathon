name: Stationnements gare de Val-de-Reuil (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stationnements autour de la gare
        continue-on-error: true
        run: |
          mkdir -p fetch/gare2 && cd fetch/gare2
          UA="marathon-prepa/1.0 (github actions)"
          Q='[out:json][timeout:90];(nwr["amenity"="parking"](49.266,1.218,49.284,1.245);way["highway"~"footway|path|pedestrian|cycleway|steps"](49.268,1.215,49.282,1.240);way["parking:lane:both"](49.266,1.218,49.284,1.245);way["parking:both"](49.266,1.218,49.284,1.245););out geom tags;'
          for k in 1 2 3 4; do for srv in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            curl -sS -m 150 -A "$UA" --data-urlencode "data=$Q" "$srv" -o over.json || true
            python3 -c "import json;d=json.load(open('over.json'));print(len(d['elements']))" && break 2; sleep 15; done; done
          ls -la
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: gare Val-de-Reuil (temporaire)" || true
          git push
