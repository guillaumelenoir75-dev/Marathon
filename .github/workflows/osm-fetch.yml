name: Vérification suivi Guillaume (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Base de données
        continue-on-error: true
        run: |
          mkdir -p audit/out
          DB=https://prepa-marathon-default-rtdb.europe-west1.firebasedatabase.app
          echo "lecture /live : $(curl -s -o /dev/null -w '%{http_code}' $DB/live.json) $(curl -s $DB/live.json | head -c 200)" >> audit/out/log.txt
          echo "écriture anonyme /live : $(curl -s -o /dev/null -w '%{http_code}' -X PATCH -d '{"status":"pirate"}' $DB/live.json)" >> audit/out/log.txt
          echo "lecture /users (doit être refusée) : $(curl -s -o /dev/null -w '%{http_code}' $DB/users.json)" >> audit/out/log.txt
      - name: Playwright
        continue-on-error: true
        run: |
          mkdir -p e2e && cd e2e && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp ../audit/s.js . && OUT=../audit/out timeout 600 node s.js || true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: vérification suivi (temporaire)" || true
          git push
