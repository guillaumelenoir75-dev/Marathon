name: Audit GPS vue 3D (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml
      - audit/**

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build app (main + patch)
        working-directory: app
        run: |
          cp ../work/audit/patch/* public-static/src/
          npm ci
          npm run build
      - name: Serveur + Playwright
        run: |
          (cd app/dist && python3 -m http.server 8765 >/dev/null 2>&1 &)
          mkdir e2e && cd e2e && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp ../work/audit/vis.js . && OUT=../work/audit/out timeout 1200 node vis.js || true
      - name: Commit résultats
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: résultats audit GPS e2e (temporaire)" || true
          git push
