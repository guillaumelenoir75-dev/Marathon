name: Vérif cache accueil (temporaire)
on:
  push:
    branches: [claude/sweet-allen-ZGlVv]
    paths: [.github/workflows/osm-fetch.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture
        continue-on-error: true
        run: |
          mkdir -p audit/out
          { echo -n "/ : "; curl -sI https://prepa-marathon.web.app/ | grep -i cache-control; echo -n "/suivi-guillaume : "; curl -sI https://prepa-marathon.web.app/suivi-guillaume | grep -i cache-control; } > audit/out/cache2.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: vérif cache accueil (temporaire)" || true
          git push
