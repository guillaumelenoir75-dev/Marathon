name: Audit production 2 (temporaire)
on:
  push:
    branches: [claude/sweet-allen-ZGlVv]
    paths: [.github/workflows/osm-fetch.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture
        continue-on-error: true
        run: |
          mkdir -p audit/out
          DB=https://prepa-marathon-default-rtdb.europe-west1.firebasedatabase.app
          F=https://us-central1-prepa-marathon.cloudfunctions.net
          W=https://prepa-marathon.web.app
          {
          echo -n "owntracks clé invalide (403) : "; curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Content-Type: application/json" -d '{"_type":"location","lat":49,"lon":1}' $F/owntracks/test-invalide
          echo -n "owntracksToken sans connexion (403) : "; curl -s -o /dev/null -w "%{http_code}\n" $F/owntracksToken
          echo -n "clé privée : "; curl -s $DB/live_config.json | tr -d '\n '; echo
          echo -n "écriture /live anonyme : "; curl -s -X PATCH -d '{"zz":1}' $DB/live.json | tr -d '\n '; echo
          echo -n "/live : "; for k in status test startedAt finishedAt s0 s0t noAuto splits pos; do echo -n "$k="; curl -s $DB/live/$k.json; echo -n " ; "; done; echo
          echo -n "ota : "; curl -s $DB/live/ota.json; echo
          for p in suivi-guillaume parcours suivi-admin; do echo -n "/$p : "; curl -s -o /tmp/p.html -w "%{http_code} " $W/$p; grep -o 'src="/src/[a-z-]*\.js?v=[0-9]*"' /tmp/p.html | tr '\n' ' '; echo -n " cache="; curl -sI $W/$p | grep -i cache-control | tr -d '\r\n'; echo; done
          echo -n "suivi-admin.js en ligne (noAuto: !live.test) : "; curl -s "$W/src/suivi-admin.js" | grep -c "noAuto: !live.test"
          date -u
          } > audit/out/prod2.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: audit production 2 (temporaire)" || true
          git push
