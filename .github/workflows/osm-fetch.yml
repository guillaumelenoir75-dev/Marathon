name: Récupération arrêté Saint-Pierre-du-Vauvray (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PDF
        run: |
          mkdir -p fetch/spv
          curl -sSL -A "Mozilla/5.0" "https://panneau-pocket.s3.gra.perf.cloud.ovh.net/source/sign_pdf/18177444326acf2a86932251.98317940-1791961734.pdf" -o fetch/spv/arrete.pdf
          ls -la fetch/spv
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: arrêté Saint-Pierre-du-Vauvray (temporaire)" || true
          git push
