name: Récupération A13 Flins → Gaillon v3 (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSRM Paris → A13 Gaillon
        continue-on-error: true
        run: |
          mkdir -p fetch/a13
          for o in "2.2567,48.8466" "2.1700,48.8700"; do
            for k in 1 2 3; do
              curl -sS -m 120 -A "marathon-prepa/1.0" "https://router.project-osrm.org/route/v1/driving/$o;1.416999,49.066219?overview=full&geometries=geojson&steps=true&annotations=distance,duration" -o fetch/a13/osrm_${o%%,*}.json && python3 -c "import json;d=json.load(open('fetch/a13/osrm_${o%%,*}.json'));print(d['code'], round(d['routes'][0]['distance']))" && break
              sleep 10
            done
          done
          ls -la fetch/a13
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: A13 Flins → Gaillon (temporaire)" || true
          git push
