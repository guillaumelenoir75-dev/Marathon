name: Fetch arrêtés + communes (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages web (2)
        run: |
          mkdir -p webdata2
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          get() { curl -sSL -m 90 -A "$UA" "$1" -o "webdata2/$2" && echo "OK $2 $(wc -c < webdata2/$2)" || echo "ECHEC $2"; }
          get "https://marathon-seine-eure.fr/villages/" villages.html
          get "https://marathon-seine-eure.fr/navettes-marathon-ekiden-semi/" navettes.html
          get "https://marathon-seine-eure.fr/wp-content/uploads/2026/01/PARCOURS-MARATHON-SEINE-EURE-2026-v2.pdf" parcours.pdf
          get "https://marathon-seine-eure.fr/wp-content/uploads/2026/07/reglement-officiel-marathon-seine-eure-2026-v5.pdf" reglement.pdf
          get "https://poses.fr/vie-municipale/les-arretes/" poses_arretes.html
          get "https://incarville.fr/actualites/" incarville_actus.html
          get "https://heudebouville.fr/actualites/" heudebouville_actus.html
          get "https://www.valdereuil.fr/actes-administratifs/arretes-de-voiries/arretes-de-voirie-temporaire/" vdr_arretes.html
          get "https://www.ville-louviers.fr/" louviers_home.html
          # Tous les liens « plans / arrêtés » trouvés dans ces pages
          python3 - <<'PY'
          import re, glob, os, subprocess, urllib.parse
          seen=set()
          for f in glob.glob('webdata2/*.html'):
              base={'villages':'https://marathon-seine-eure.fr/','poses_arretes':'https://poses.fr/','incarville_actus':'https://incarville.fr/','heudebouville_actus':'https://heudebouville.fr/','vdr_arretes':'https://www.valdereuil.fr/','navettes':'https://marathon-seine-eure.fr/','louviers_home':'https://www.ville-louviers.fr/'}.get(os.path.basename(f)[:-5],'')
              s=open(f,errors='ignore').read()
              for u in re.findall(r'(?:href|src)="([^"]+)"',s):
                  u=urllib.parse.urljoin(base,u)
                  low=urllib.parse.unquote(u).lower()
                  if any(k in low for k in ('marathon','arret','arrêt','circulation','plan-village','plans','village')) and (low.endswith(('.pdf','.jpg','.jpeg','.png','.webp')) or 'marathon' in low) and u not in seen and 'wp-json' not in low and 'feed' not in low:
                      seen.add(u)
          seen=sorted(seen)[:80]
          for i,u in enumerate(seen):
              name='link_%02d_'%i+re.sub(r'[^A-Za-z0-9._-]','_',urllib.parse.unquote(u).split('/')[-1] or 'index')[:80]
              if not os.path.splitext(name)[1]: name+='.html'
              r=subprocess.run(['curl','-sSL','-m','90','-A','Mozilla/5.0','-o','webdata2/'+name,u])
              print(r.returncode, name, u)
          PY
          ls -la webdata2
      - name: Communes OSM (géométrie)
        run: |
          UA="prepa-marathon-route-planner/1.0 (github.com/guillaumelenoir75-dev/Marathon)"
          Q='[out:json][timeout:240];relation["boundary"="administrative"]["admin_level"="8"](49.15,1.12,49.31,1.30);out geom;'
          for EP in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            curl -sSf -m 300 -A "$UA" --data-urlencode "data=$Q" "$EP" -o webdata2/communes.json && python3 -c "import json;d=json.load(open('webdata2/communes.json'));print(len(d['elements']), sum(len(e.get('members',[])) for e in d['elements']))" && break
            sleep 15
          done
          gzip -9 webdata2/communes.json || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webdata2
          git commit -m "data: pages arrêtés 2 + communes géométrie (temporaire)"
          git push
