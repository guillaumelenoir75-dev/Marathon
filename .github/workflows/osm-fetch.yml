name: Vérification fonctions (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture
        continue-on-error: true
        run: |
          mkdir -p audit/out
          {
          echo "owntracks POST sans clé :"; curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Content-Type: application/json" -d '{"_type":"location","lat":49,"lon":1}' https://us-central1-prepa-marathon.cloudfunctions.net/owntracks/test-invalide
          echo "owntracksToken sans auth :"; curl -s -o /dev/null -w "%{http_code}\n" https://us-central1-prepa-marathon.cloudfunctions.net/owntracksToken
          echo "hosting /suivi-guillaume :"; curl -s -o /dev/null -w "%{http_code}\n" https://prepa-marathon.web.app/suivi-guillaume
          echo "hosting /parcours version race-map :"; curl -s https://prepa-marathon.web.app/parcours | grep -o 'race-map.js?v=[0-9]*'
          echo "RTDB /live/ota :"; curl -s https://prepa-marathon-default-rtdb.europe-west1.firebasedatabase.app/live/ota.json; echo
          echo "RTDB /live/status :"; curl -s https://prepa-marathon-default-rtdb.europe-west1.firebasedatabase.app/live/status.json; echo
          date -u
          } > audit/out/fn.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: vérification fonctions (temporaire)" || true
          git push
