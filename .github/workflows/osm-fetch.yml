name: Récupération A13 Flins → Gaillon v2 (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overpass
        continue-on-error: true
        run: |
          mkdir -p fetch/a13
          Q='[out:json][timeout:240];(way["highway"="motorway"]["ref"~"A ?13"](48.90,1.38,49.09,1.97);node["highway"="motorway_junction"](48.90,1.38,49.09,1.97););out geom tags;'
          ok=0
          for k in 1 2 3; do
            for srv in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
              curl -sS -m 300 -A "marathon-prepa/1.0" --data-urlencode "data=$Q" "$srv" -o fetch/a13/a13.json || true
              if python3 -c "import json;d=json.load(open('fetch/a13/a13.json'));print(len(d['elements']));assert len(d['elements'])>10"; then ok=1; break 2; fi
              sleep 20
            done
          done
          echo ok=$ok
          ls -la fetch/a13
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: A13 Flins → Gaillon (temporaire)" || true
          git push
