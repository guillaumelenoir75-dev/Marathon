name: Géocodage (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture
        continue-on-error: true
        run: |
          mkdir -p audit/out
          curl -s "https://api-adresse.data.gouv.fr/search/?q=49+Rue+de+Paris+27400+Louviers&limit=5" > audit/out/ban.json
          curl -s -A "prepa-marathon-check (guillaume)" "https://nominatim.openstreetmap.org/search?q=49+Rue+de+Paris,+27400+Louviers,+France&format=json&addressdetails=1&limit=5" > audit/out/nomi.json
          curl -s "https://api-adresse.data.gouv.fr/reverse/?lon=1.18227&lat=49.20633&limit=3" > audit/out/rev.json
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: géocodage (temporaire)" || true
          git push
