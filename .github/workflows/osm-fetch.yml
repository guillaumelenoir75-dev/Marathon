name: Vérif production jour J (temporaire)
on:
  push:
    branches: [claude/sweet-allen-ZGlVv]
    paths: [.github/workflows/osm-fetch.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture
        continue-on-error: true
        run: |
          mkdir -p audit/out
          DB=https://prepa-marathon-default-rtdb.europe-west1.firebasedatabase.app
          F=https://us-central1-prepa-marathon.cloudfunctions.net
          W=https://prepa-marathon.web.app
          {
          echo -n "owntracks (403 attendu) : "; curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Content-Type: application/json" -d '{"_type":"location","lat":49,"lon":1}' $F/owntracks/test-invalide
          echo -n "clé privée : "; curl -s $DB/live_config.json | tr -d '\n '; echo
          echo -n "/live : "; for k in status test startedAt rid splits pos; do echo -n "$k="; curl -s $DB/live/$k.json; echo -n " ; "; done; echo
          echo -n "ota : "; curl -s $DB/live/ota.json; echo
          for p in suivi-guillaume parcours suivi-admin; do echo -n "/$p : "; curl -s -o /tmp/p.html -w "%{http_code} " $W/$p; grep -o 'src="/src/suivi[a-z-]*\.js?v=[0-9]*"' /tmp/p.html | tr '\n' ' '; grep -c 'v-track' /tmp/p.html; done
          echo -n "suivi-core en ligne (rid + suiviPlanAdvance) : "; curl -s "$W/src/suivi-core.js" | grep -c -E "live.rid|function suiviPlanAdvance"
          date -u
          } > audit/out/prod3.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: vérif production jour J (temporaire)" || true
          git push
