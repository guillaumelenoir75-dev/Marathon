name: Centre technique municipal Val-de-Reuil (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centre technique municipal
        continue-on-error: true
        run: |
          mkdir -p fetch/ctm && cd fetch/ctm
          UA="marathon-prepa/1.0 (github actions)"
          curl -sS -m 60 -A "$UA" "https://nominatim.openstreetmap.org/search?q=centre+technique+municipal+Val-de-Reuil&format=jsonv2&limit=5" -o nomi_ctm.json || true
          sleep 2
          curl -sS -m 60 -A "$UA" "https://nominatim.openstreetmap.org/reverse?lat=49.27261&lon=1.22423&format=jsonv2&zoom=18" -o rev481.json || true
          Q='[out:json][timeout:90];(nwr(around:220,49.2726,1.2242)[~"^(name|amenity|office|landuse|building|shop|industrial)$"~"."];);out center tags;'
          for k in 1 2 3; do for srv in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -sS -m 120 -A "$UA" --data-urlencode "data=$Q" "$srv" -o over.json || true
            python3 -c "import json;json.load(open('over.json'))" && break 2; sleep 10; done; done
          ls -la
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: 481 chaussée des Berges (temporaire)" || true
          git push
