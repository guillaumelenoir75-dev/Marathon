name: OSM fetch audit (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger barrières, interdictions de tourner, chemins piétons, travaux
        run: |
          mkdir -p osmdata
          UA="prepa-marathon-route-planner/1.0 (github.com/guillaumelenoir75-dev/Marathon)"
          fetch() {
            local query="$1" out="$2"
            for attempt in 1 2 3; do
              for EP in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
                if curl -sSf -m 300 -A "$UA" --data-urlencode "data=$query" "$EP" -o "$out.tmp" && python3 -c "import json; d=json.load(open('$out.tmp')); print(len(d['elements']),'elements', d.get('osm3s',{}).get('timestamp_osm_base'))"; then
                  mv "$out.tmp" "$out"; echo "OK $out via $EP"; return 0
                fi
                sleep 15
              done
            done
            return 1
          }
          BB='49.12,1.10,49.33,1.32'
          fetch "[out:json][timeout:180];(node[\"barrier\"]($BB);node[\"highway\"~\"^(traffic_signals|stop|give_way|crossing)$\"]($BB););out;" osmdata/barriers.json
          fetch "[out:json][timeout:180];(relation[\"type\"=\"restriction\"]($BB);relation[\"type\"=\"restriction\"]($BB)>;);out body;" osmdata/restrictions.json
          fetch "[out:json][timeout:180];(way[\"highway\"~\"^(footway|path|cycleway|pedestrian|steps|track|bridleway|construction)$\"]($BB);way[\"construction\"]($BB););out tags geom;" osmdata/paths.json
          ls -la osmdata
          gzip -9 osmdata/*.json
      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add osmdata
          git commit -m "data: extrait OSM audit (temporaire)"
          git push
