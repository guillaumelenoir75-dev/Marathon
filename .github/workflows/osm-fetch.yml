name: Récupération infos Incarville (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Article + pièces jointes
        run: |
          mkdir -p fetch/inc && cd fetch/inc
          curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "https://laclepublique.fr/eure/articles/2026/2026-10-10-marathon-seine-eure-2026/" -o article.html || true
          python3 - <<'PY'
          import re, html, urllib.request, urllib.parse
          base = 'https://laclepublique.fr/eure/articles/2026/2026-10-10-marathon-seine-eure-2026/'
          src = open('article.html', encoding='utf-8', errors='ignore').read()
          urls = set(urllib.parse.urljoin(base, html.unescape(u)) for u in re.findall(r'(?:href|src|data-src|srcset)="([^" ]+)', src))
          keep = sorted(u for u in urls if re.search(r'\.(pdf|jpe?g|png|webp)(\?|$)', u, re.I) and not re.search(r'logo|icon|favicon|avatar', u, re.I))
          print('\n'.join(keep))
          for u in keep[:30]:
              name = re.sub(r'[^A-Za-z0-9._-]', '_', u.split('?')[0].split('/')[-1])[:120]
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                  open(name, 'wb').write(urllib.request.urlopen(req, timeout=60).read()); print('ok', name)
              except Exception as e: print('ko', u, e)
          txt = re.sub(r'<script.*?</script>|<style.*?</style>|<nav.*?</nav>|<header.*?</header>|<footer.*?</footer>', '', src, flags=re.S)
          txt = html.unescape(re.sub(r'<[^>]+>', '\n', txt)); txt = re.sub(r'\n\s*\n+', '\n', txt)
          open('texte.txt', 'w').write(txt)
          PY
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: infos Incarville (temporaire)" || true
          git push
