name: Vérif cache (temporaire)
on:
  push:
    branches: [claude/sweet-allen-ZGlVv]
    paths: [.github/workflows/osm-fetch.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lecture
        continue-on-error: true
        run: |
          mkdir -p audit/out
          { for p in suivi-guillaume parcours suivi-admin secours trajet-amis; do echo -n "/$p : "; curl -sI https://prepa-marathon.web.app/$p | grep -i -E "^(HTTP|cache-control)" | tr '\r\n' '  '; echo; done; } > audit/out/cache.txt 2>&1
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/out
          git commit -m "data: vérif cache (temporaire)" || true
          git push
