name: Récupération A13 Flins → Gaillon (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overpass
        continue-on-error: true
        run: |
          mkdir -p fetch/a13
          Q='[out:json][timeout:180];(way["highway"~"^motorway(_link)?$"](48.88,1.38,49.10,1.98);node["highway"="motorway_junction"](48.88,1.38,49.10,1.98););out geom tags;'
          for srv in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            curl -sS -A "marathon-prepa/1.0" --data-urlencode "data=$Q" "$srv" -o fetch/a13/a13.json && python3 -c "import json;d=json.load(open('fetch/a13/a13.json'));print(len(d['elements']))" && break
            sleep 5
          done
          ls -la fetch/a13
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: A13 Flins → Gaillon (temporaire)" || true
          git push
