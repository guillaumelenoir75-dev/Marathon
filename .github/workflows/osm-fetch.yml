name: Fetch arrêtés + communes (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages web
        run: |
          mkdir -p webdata
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          get() { curl -sSL -m 60 -A "$UA" "$1" -o "webdata/$2" && echo "OK $2 $(wc -c < webdata/$2)" || echo "ECHEC $2"; }
          get "https://www.valdereuil.fr/actualites/marathon-seine-eure-rendez-vous-pour-une-grande-fete-du-sport" valdereuil.html
          get "https://laclepublique.fr/eure/articles/2026/2026-10-10-marathon-seine-eure-2026/" laclepublique.html
          get "https://www.ville-louviers.fr/marathon-seine-eure/" louviers.html
          get "https://marathon-seine-eure.fr/parcours-marathon-seine-eure/" parcours.html
          get "https://marathon-seine-eure.fr/informations-generales/" infos.html
          get "https://marathon-seine-eure.fr/presentation/" presentation.html
          get "https://declaration-manifestations.gouv.fr/dossier/51603/" declaration2024.html
          get "https://www.agglo-seine-eure.fr/events/marathon-seine-eure-2026/" agglo.html
          get "https://www.tourisme-seine-eure.com/en/discover/major-events/seine-eure-marathon/" tourisme.html
          for site in poses.fr porte-de-seine.fr saint-pierre-du-vauvray.fr saint-etienne-du-vauvray.fr incarville.fr levaudreuil.fr lery.fr mairie-lery.fr heudebouville.fr vironvay.fr; do get "https://www.$site/" "home_$site.html"; done
          ls -la webdata
      - name: Communes OSM (limites administratives)
        run: |
          UA="prepa-marathon-route-planner/1.0 (github.com/guillaumelenoir75-dev/Marathon)"
          Q='[out:json][timeout:180];(relation["boundary"="administrative"]["admin_level"="8"](49.12,1.10,49.33,1.42););out tags geom;'
          for EP in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            curl -sSf -m 300 -A "$UA" --data-urlencode "data=$Q" "$EP" -o webdata/communes.json && python3 -c "import json;d=json.load(open('webdata/communes.json'));print(len(d['elements']))" && break
            sleep 15
          done
          gzip -9 webdata/communes.json || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webdata
          git commit -m "data: pages arrêtés + communes (temporaire)"
          git push
