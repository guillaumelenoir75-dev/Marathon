name: OSM fetch (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger routes + parkings OSM (Overpass)
        run: |
          mkdir -p osmdata
          UA="prepa-marathon-route-planner/1.0 (github.com/guillaumelenoir75-dev/Marathon)"
          fetch() {
            local query="$1" out="$2"
            for attempt in 1 2 3; do
              for EP in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
                if curl -sSf -m 300 -A "$UA" --data-urlencode "data=$query" "$EP" -o "$out.tmp" && python3 -c "import json,sys; d=json.load(open('$out.tmp')); assert len(d['elements'])>0; print(len(d['elements']),'elements')"; then
                  mv "$out.tmp" "$out"; echo "OK $out via $EP"; return 0
                fi
                sleep 15
              done
            done
            return 1
          }
          fetch '[out:json][timeout:180];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"](49.08,1.02,49.38,1.42););out tags geom;' osmdata/roads.json
          fetch '[out:json][timeout:120];(nwr["amenity"="parking"](49.12,1.10,49.33,1.32););out tags center;' osmdata/parking.json
          ls -la osmdata
          gzip -9 osmdata/roads.json osmdata/parking.json
      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add osmdata
          git commit -m "data: extrait OSM routes + parkings (temporaire)"
          git push
