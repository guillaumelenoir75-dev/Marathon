name: Géocodage adresse km 30 (temporaire)

on:
  push:
    branches:
      - claude/sweet-allen-ZGlVv
    paths:
      - .github/workflows/osm-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adresses
        run: |
          mkdir -p fetch/addr && cd fetch/addr
          UA="marathon-prepa/1.0 (github actions)"
          curl -sS -A "$UA" --data-urlencode 'data=[out:json][timeout:60];(nwr["addr:street"~"Portejoie",i](49.24,1.23,49.30,1.29);way["name"~"Portejoie",i](49.24,1.23,49.30,1.29););out center tags;' https://overpass-api.de/api/interpreter -o overpass.json || true
          curl -sS -A "$UA" "https://nominatim.openstreetmap.org/search?street=24+route+de+Portejoie&city=Porte-de-Seine&country=France&format=jsonv2&addressdetails=1" -o nomi1.json || true
          sleep 2
          curl -sS -A "$UA" "https://nominatim.openstreetmap.org/search?q=24+route+de+Portejoie+Tournedos-sur-Seine&format=jsonv2&addressdetails=1" -o nomi2.json || true
          sleep 2
          curl -sS -A "$UA" "https://nominatim.openstreetmap.org/search?q=24+route+de+Portejoie+27430&format=jsonv2&addressdetails=1" -o nomi3.json || true
          curl -sS "https://api-adresse.data.gouv.fr/search/?q=24+route+de+Portejoie+Porte-de-Seine&limit=5" -o ban1.json || true
          curl -sS "https://api-adresse.data.gouv.fr/search/?q=24+route+de+Portejoie+Tournedos-sur-Seine&limit=5" -o ban2.json || true
          curl -sS "https://api-adresse.data.gouv.fr/search/?q=route+de+Portejoie+27430&type=street&limit=10" -o ban3.json || true
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch
          git commit -m "data: géocodage adresse km 30 (temporaire)" || true
          git push
